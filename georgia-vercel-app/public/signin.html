<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Georgia’s Support App</title><style>body{margin:0;background:#f6fafb;color:#174b55;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{background:white;border:1px solid #d8e6e8;border-radius:16px;padding:36px;width:min(360px,calc(100vw - 100px))}h1{font-size:26px;line-height:1.2}p{color:#647b80}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #d8e6e8;font:inherit}button{margin-top:24px;background:#347f86;color:white;cursor:pointer}button:disabled{opacity:.6}#message{color:#8c3434}</style></head><body><main><h1>Georgia’s Support App</h1><p>Sign in with your app account. Authentication is provided by Supabase.</p><p><a href="/">← About this workspace</a></p><form id="signin"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in</button><p id="message" role="alert"></p></form><p>Access is for Georgia and approved support workers. Contact Georgia if you need help signing in.</p></main><script type="module">import{signIn}from'/auth.js';document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;document.querySelector('#message').textContent='';try{await signIn(document.querySelector('#email').value.trim(),document.querySelector('#password').value);location.replace('/app.html');}catch(error){document.querySelector('#message').textContent=error.message;}finally{b.disabled=false;}});</script></body></html>
